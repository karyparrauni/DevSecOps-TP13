env:
  contexts:
    - name: notes-app-context
      urls:
        - "http://host.docker.internal"
      includePaths:
        - "http://host.docker.internal/.*"

      authentication:
        method: json
        parameters:
          loginPageUrl: "http://host.docker.internal"
          loginRequestUrl: "http://host.docker.internal/api/login"
          loginRequestBody: '{"username":"${ZAP_APP_USER}","password":"${ZAP_APP_PASSWORD}"}'
        verification:
          method: response
          loggedInRegex: "autenticación correcta"
          loggedOutRegex: "autenticación requerida"

      users:
        - name: zap-user
          credentials:
            username: "${ZAP_APP_USER}"
            password: "${ZAP_APP_PASSWORD}"

  parameters:
    failOnError: true
    failOnWarning: false

jobs:
  - type: spider
    parameters:
      context: notes-app-context
      maxDuration: 2

  - type: spiderAjax
    parameters:
      context: notes-app-context
      maxDuration: 2

  - type: passiveScan-wait

  - type: activeScan
    parameters:
      context: notes-app-context
      user: zap-user
      policy: Default Policy
      maxScanDurationInMins: 5

  - type: report
    parameters:
      template: modern
      reportDir: /zap/wrk/reports
      reportFile: zap-report
      reportTitle: "Notes App - Security Scan Report"
