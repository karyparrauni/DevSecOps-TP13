<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Notes App</title>
  <style>
    body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f6f7f9}
    form,article{background:white;padding:1rem;margin:1rem 0;border-radius:.6rem}
    input,button{padding:.6rem;margin:.2rem}
    input{width:38%}
    #app{display:none}
  </style>
</head>

<body>

<h1>Notes App — Operaciones 1</h1>

<section id="login">
  <h2>Autenticación</h2>

  <form id="loginForm">
    <input id="username" required placeholder="Usuario">
    <input id="password" type="password" required placeholder="Contraseña">
    <button>Ingresar</button>
  </form>

  <p id="loginStatus"></p>
</section>

<section id="app">
  <p id="status">Comprobando…</p>

  <form id="form">
    <input id="title" required maxlength="200" placeholder="Título">
    <input id="content" placeholder="Contenido">
    <button>Crear</button>
  </form>

  <main id="notes"></main>
</section>

<script>
const loginEl = document.getElementById('login');
const appEl = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginStatus = document.getElementById('loginStatus');
const statusEl = document.getElementById('status');
const notesEl = document.getElementById('notes');
const formEl = document.getElementById('form');
const titleEl = document.getElementById('title');
const contentEl = document.getElementById('content');

let token = null;

loginForm.onsubmit = async e => {
  e.preventDefault();

  loginStatus.textContent = 'Autenticando…';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Error de autenticación');
    }

    token = data.token;

    loginEl.style.display = 'none';
    appEl.style.display = 'block';

    await load();

  } catch (error) {
    loginStatus.textContent = 'Error: ' + error.message;
  }
};

async function load() {
  try {
    const health = await fetch('/health');

    if (!health.ok) {
      throw new Error('health ' + health.status);
    }

    const response = await fetch('/api/notes', {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    if (!response.ok) {
      throw new Error('notes ' + response.status);
    }

    const notes = await response.json();

    statusEl.textContent = 'Autenticado — Backend y base conectados';

    notesEl.innerHTML = notes.map(note =>
      `<article>
        <b>${esc(note.title)}</b>
        <p>${esc(note.content)}</p>
        <button onclick="del(${note.id})">Eliminar</button>
      </article>`
    ).join('');

  } catch (error) {
    statusEl.textContent = 'Servicio no disponible: ' + error.message;
  }
}

async function del(id) {
  await fetch('/api/notes/' + id, {
    method: 'DELETE',
    headers: {
      'Authorization': 'Bearer ' + token
    }
  });

  await load();
}

formEl.onsubmit = async e => {
  e.preventDefault();

  const response = await fetch('/api/notes', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({
      title: titleEl.value,
      content: contentEl.value
    })
  });

  if (!response.ok) {
    statusEl.textContent = 'Error al crear la nota: ' + response.status;
    return;
  }

  formEl.reset();
  await load();
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}
</script>

</body>
</html>
